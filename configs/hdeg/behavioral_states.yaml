schema_version: "1.0"
artifact_type: "hdeg_behavioral_state_configuration"
status: "frozen_semantic_configuration"

dataset:
  name: "CU"
  selected_device_count: 23
  device_order_source: "devices.json"
  device_ordering_rule: "exact_file_order"

semantic_policy:
  compatibility_relation: "DIRECT"
  contextual_edges: "none"
  matrix_semantics: "M[k,i] = 1 iff selected device feature i is semantically compatible with behavioral state k."
  contextual_edge_policy: "Plausible but indirect or predictive relationships are excluded from the fixed compatibility prior."

behavioral_states:
  - id: "access_entry"
    index: 0
    name: "Access / Entry"
    confidence: "high"
    provenance_type: "dataset_semantics"
    rationale: "Contact features directly represent contact/access events."
    compatible_devices:
      - index: 0
        id: "binary_sensor.smartthings_contact_sensor_pid_004_contact"
        relation: "DIRECT"
      - index: 1
        id: "binary_sensor.smartthings_contact_sensor_pid_006_contact"
        relation: "DIRECT"
      - index: 2
        id: "binary_sensor.smartthings_contact_sensor_pid_003_contact"
        relation: "DIRECT"
      - index: 3
        id: "binary_sensor.xiaomi_contact_sensor_pid_136_contact"
        relation: "DIRECT"
  - id: "occupancy_presence"
    index: 1
    name: "Occupancy / Presence"
    confidence: "high"
    provenance_type: "dataset_semantics_plus_semantic_adjudication"
    rationale: "Selected features directly represent occupancy/motion; contact-to-occupancy contextual edges were rejected."
    compatible_devices:
      - index: 4
        id: "binary_sensor.xiaomi_motion_sensor_kitchen_occupancy"
        relation: "DIRECT"
      - index: 5
        id: "binary_sensor.xiaomi_motion_sensor_workarea_occupancy"
        relation: "DIRECT"
      - index: 6
        id: "binary_sensor.aqara_motion_sensor_pid_075_occupancy"
        relation: "DIRECT"
      - index: 7
        id: "binary_sensor.hue_motion_sensor_1_motion"
        relation: "DIRECT"
  - id: "physical_disturbance"
    index: 2
    name: "Physical Disturbance"
    confidence: "high"
    provenance_type: "dataset_semantics"
    rationale: "Selected features directly represent vibration events."
    compatible_devices:
      - index: 8
        id: "binary_sensor.aqara_vibration_sensor_pid_077_vibration"
