      - index: 14
        id: "sensor.aqara_temperature_and_humidity_pid_074_temperature"
        relation: "DIRECT"
  - id: "switch_controlled_appliance_activity"
    index: 4
    name: "Switch-Controlled Appliance Activity"
    confidence: "high"
    provenance_type: "dataset_semantics_plus_semantic_adjudication"
    rationale: "Selected features directly represent the Kasa switch states."
    compatible_devices:
